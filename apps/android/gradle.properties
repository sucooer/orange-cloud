org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# ⚠️ fix/android-oss-crash：恢复 2.1.1 基线 —— 删除 AGP 9 特有开关
# （optimizedResourceShrinking / strictFullModeForKeepRules / builtInKotlin / newDsl 等）。
# 原 HEAD 保留这些开关时 AGP 8.13 会忽略或报 deprecated，且 AGP 9 的 R8 行为正是闪退根源。
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
